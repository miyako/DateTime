name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact normalized commit to build
        type: string
        default: ''
      release_call:
        description: Release caller performs mandatory 4D acceptance separately
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.configuration.outputs.matrix }}
      initialized: ${{ steps.configuration.outputs.initialized }}
      language: ${{ steps.configuration.outputs.language }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated reference icons
        run: python scripts/generate_icons.py --check
      - name: Static and initializer tests (no CLI toolchains)
        env:
          TEST_CLI_LANGUAGE: none
        run: python -m unittest discover -s tests -v
      - name: Read configured native matrix
        id: configuration
        run: python scripts/ci_config.py matrix

  native:
    needs: configuration
    if: needs.configuration.outputs.initialized == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TEST_CLI_LANGUAGE: ${{ matrix.language }}
      CLI_TARGET: ${{ matrix.target }}
      CLI_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26.10'
          cache: false
      - name: Initialize native VS2022 x64 compiler and SDK environment
        if: matrix.language == 'cpp' && matrix.target == 'windows-x64'
        uses: ./.github/actions/cpp-environment
      - name: Set up Rust 1.99.1 only when selected
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Select Rust 1.99.1
        if: matrix.language == 'rust'
        run: rustup default 1.99.1
      - name: Native build and protocol smoke tests
        run: python scripts/build_cli.py --target "$CLI_TARGET" --language "$CLI_LANGUAGE"
        shell: bash
      - name: Reuse the same native C++ executable in Python contract tests
        if: matrix.language == 'cpp'
        shell: python
        run: |
          import json, os
          from pathlib import Path
          config = json.loads(Path("template.json").read_text(encoding="utf-8"))
          target = os.environ["CLI_TARGET"]
          filename = config["cli"] + (".exe" if target == "windows-x64" else "")
          executable = Path.cwd() / "build" / target / filename
          if not executable.is_file():
              raise RuntimeError("the native build did not produce its configured executable")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("DATETIME_TEST_EXECUTABLE=" + str(executable) + "\n")
      - name: Selected CLI contract tests against the built executable
        run: python -m unittest discover -s tests -p test_cli.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/*
            !build/${{ matrix.target }}/cargo/**
            !build/${{ matrix.target }}/cmake/**
          if-no-files-found: error
          retention-days: 7
      - name: Verify installed footprint, private ICU symbols and process overhead
        if: matrix.language == 'cpp'
        run: python scripts/measure_cli.py --root . --executable "$DATETIME_TEST_EXECUTABLE" --samples 5 --warmups 2 --counts 1 16 256
        shell: bash
      - uses: actions/upload-artifact@v4
        if: matrix.language == 'cpp' && !cancelled()
        with:
          name: icu-measure-${{ matrix.target }}
          path: |
            build/measure/${{ matrix.target }}/measurement.json
            build/measure/${{ matrix.target }}/*/datetime-executable.zip
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native ICU build diagnostics on failure
        if: failure() && matrix.language == 'cpp'
        uses: actions/upload-artifact@v4
        with:
          name: icu-diagnostics-${{ matrix.target }}
          path: build/icu/${{ matrix.target }}/**/*.log
          if-no-files-found: warn
          retention-days: 7

  baseline:
    name: Optional full-static baseline (${{ matrix.target }})
    needs: [configuration, native]
    if: needs.configuration.outputs.language == 'cpp' && !inputs.release_call && github.ref_type != 'tag'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CLI_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/cpp-environment
        if: matrix.target == 'windows-x64'
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: build/${{ matrix.target }}
      - name: Measure complete unfiltered and tailored static data independently
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          config = json.loads(Path("template.json").read_text(encoding="utf-8"))
          target = os.environ["CLI_TARGET"]
          executable = Path("build") / target / (config["cli"] + (".exe" if target == "windows-x64" else ""))
          executable.chmod(0o755)
          subprocess.run([sys.executable, "scripts/measure_cli.py", "--root", ".",
                          "--executable", str(executable), "--compare",
                          "--samples", "5", "--warmups", "2", "--counts", "1", "16", "256"], check=True)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: icu-baseline-${{ matrix.target }}
          path: |
            build/measure/${{ matrix.target }}/measurement.json
            build/measure/${{ matrix.target }}/*/datetime-executable.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: icu-baseline-diagnostics-${{ matrix.target }}
          path: build/icu/${{ matrix.target }}/**/*.log
          if-no-files-found: warn
          retention-days: 7

  assembly:
    needs: [configuration, native]
    if: needs.configuration.outputs.initialized == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Assemble universal macOS and x64 Windows resources
        id: assemble
        run: python scripts/ci_config.py assemble
      - uses: actions/upload-artifact@v4
        with:
          name: component-resources
          path: ${{ steps.assemble.outputs.resources }}
          if-no-files-found: error
          retention-days: 7
      - name: Download pinned free tool4D for optional branch and PR integration tests
        if: vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
        env:
          TOOL4D_URL: ${{ vars.TOOL4D_URL }}
          TOOL4D_SHA256: ${{ vars.TOOL4D_SHA256 }}
        run: python scripts/ci_config.py download-tool4d
      - name: Build and accept an inspectable compiled component without publication
        if: vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
        run: >-
          python scripts/accept_hosted.py --repository "$GITHUB_REPOSITORY"
          --tool4d .tools/tool4d.app/Contents/MacOS/tool4d
      - name: Retain accepted compiled ZIP and adjacent evidence
        if: vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
        uses: actions/upload-artifact@v4
        with:
          name: compiled-component
          path: |
            dist/*.zip
            dist/*.acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed or successful 4D diagnostics
        if: always() && vars.FOURD_ENABLED == 'true' && github.ref_type != 'tag' && !inputs.release_call
        uses: actions/upload-artifact@v4
        with:
          name: component-acceptance-diagnostics
          path: |
            build/hosted-acceptance.json
            build/source-host-status.json
            build/compile-status.json
            build/compiled-host-status.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 30
